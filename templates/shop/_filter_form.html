<form method="get"><label>Tìm theo tên, tác giả, ISBN<input name="q" value="{{ q }}" placeholder="Tên sách hoặc ISBN"></label><label>Danh mục<select name="category"><option value="">Tất cả danh mục</option>{% for c in categories %}<option value="{{ c.slug }}" {% if cat == c.slug %}selected{% endif %}>{{ c.name_vi }}</option>{% endfor %}</select></label><label>Sắp xếp<select name="sort"><option value="new">Mới nhất</option><option value="low" {% if sort == 'low' %}selected{% endif %}>Giá tăng dần</option><option value="high" {% if sort == 'high' %}selected{% endif %}>Giá giảm dần</option><option value="name" {% if sort == 'name' %}selected{% endif %}>Theo tên</option></select></label><button class="btn btn-navy" type="submit">Áp dụng bộ lọc</button></form>

<div data-lines class="lines-editor"><div data-line class="line-editor"><select name="book" required><option value="">— Chọn sách —</option>{% for b in books %}<option value="{{ b.pk }}" data-isbn="{{ b.isbn }}" data-stock="{{ b.stock }}" data-price="{{ b.price }}">{{ b.title_vi }} · {{ b.isbn }} (còn {{ b.stock }})</option>{% endfor %}</select><input type="number" name="quantity" value="1" min="1" max="1000" required placeholder="SL">{% if purchase %}<input type="number" name="unit_cost" min="0" value="0" required placeholder="Giá nhập">{% endif %}<button class="btn btn-outline btn-sm" type="button" data-remove-line>Xóa</button></div></div><button type="button" class="btn btn-outline btn-sm" data-add-line>+ Thêm dòng sách</button>

<div data-lines class="lines-editor"><div data-line class="line-editor"><select name="book" required aria-label="Sách"><option value="">Chọn sách</option>{% for b in books %}<option value="{{ b.pk }}" data-isbn="{{ b.isbn }}" data-stock="{{ b.stock }}" data-price="{{ b.price }}">{{ b.title_vi }} · {{ b.isbn }} (còn {{ b.stock }})</option>{% endfor %}</select><input type="number" name="quantity" value="1" min="1" max="1000" required placeholder="SL" aria-label="Số lượng">{% if purchase %}<input type="number" name="unit_cost" min="0" value="0" required placeholder="Giá nhập" aria-label="Giá nhập (VNĐ)">{% endif %}<button class="btn btn-ghost btn-sm btn-icon" type="button" data-remove-line aria-label="Xóa dòng" title="Xóa dòng"><i class="ph ph-trash" aria-hidden="true"></i></button></div></div>
<button type="button" class="btn btn-ghost btn-sm" data-add-line><i class="ph ph-plus" aria-hidden="true"></i>Thêm dòng sách</button>

{% extends 'management/base.html' %}{% block manage_title %}Đơn hàng{% endblock %}{% block manage_content %}
<div class="manager-heading"><div><h1>Quản lý đơn hàng</h1><p>Đơn website, POS, Facebook và Instagram cùng một nguồn dữ liệu.</p></div><div class="action-inline"><a class="btn btn-ghost" href="{% url 'export_orders' %}"><i class="ph ph-download-simple" aria-hidden="true"></i>Xuất CSV</a><a class="btn btn-primary" href="{% url 'social_order' %}"><i class="ph ph-plus" aria-hidden="true"></i>Nhập đơn mạng xã hội</a></div></div>
<div class="paper-panel"><form method="get" class="filter-row"><input name="q" value="{{ q }}" placeholder="Mã đơn / Khách / SĐT" aria-label="Tìm đơn"><select name="source" aria-label="Kênh bán"><option value="">Mọi kênh</option>{% for key,label in sources %}<option value="{{ key }}" {% if source == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><select name="status" aria-label="Trạng thái"><option value="">Mọi trạng thái</option>{% for key,label in statuses %}<option value="{{ key }}" {% if status == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="btn btn-navy">Lọc đơn</button></form>
{% include 'management/_table_orders.html' %}</div>
{% endblock %}
